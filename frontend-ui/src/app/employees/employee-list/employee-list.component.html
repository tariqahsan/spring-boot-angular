<div class="section-card">

  <!-- Card Header -->
  <div class="section-card-header">
    <span class="section-title">Personnel Records</span>
    <button mat-flat-button class="btn-create" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      Add Employee
    </button>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <mat-icon class="filter-icon">search</mat-icon>
    <mat-form-field appearance="outline" class="search-form-field">
      <mat-label>Filter employees…</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
  </div>

  <!-- Table -->
  <div class="mat-elevation-z1">
    <table mat-table [dataSource]="dataSource" matSort class="employee-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row" class="col-id">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
        <td mat-cell *matCellDef="let row" class="col-firstname">{{ row.firstName }}</td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
        <td mat-cell *matCellDef="let row" class="col-lastname">{{ row.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Address</th>
        <td mat-cell *matCellDef="let row">{{ row.address }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
        <td mat-cell *matCellDef="let row" class="col-phone">{{ row.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let row" class="col-email">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="col-actions"></th>
        <td mat-cell *matCellDef="let row" class="col-actions">
          <button mat-icon-button class="action-btn edit-btn"
                  matTooltip="Edit employee"
                  (click)="onEdit(row)">
            <mat-icon>launch</mat-icon>
          </button>
          <button mat-icon-button class="action-btn delete-btn"
                  matTooltip="Delete employee"
                  (click)="onDelete(row.id)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="7"
            style="text-align:center; padding:36px 16px; color:var(--text-muted); font-style:italic;">
          No records matching <strong>{{ input.value }}</strong>
        </td>
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
                   aria-label="Select page of employees"
                   showFirstLastButtons>
    </mat-paginator>
  </div>

</div>
